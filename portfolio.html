<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d19">
  <meta name="description" content="نمونه‌کارها و خدمات ALIREZA WEB؛ طراحی وب، گرافیک، فناوری و خدمات PS4.">
  <title>نمونه‌کارها و خدمات | ALIREZA WEB</title>
  <link rel="stylesheet" href="style.css">

  <style>
    :root {
      --glass-bg: rgba(15, 25, 45, .58);
      --glass-border: rgba(125, 190, 255, .19);
      --glass-blue: #52c8ff;
      --glass-text: #edf6ff;
      --glass-muted: #a7b8d0;
    }

    body {
      background:
        radial-gradient(ellipse at 12% 12%, rgba(0,136,255,.17), transparent 38%),
        radial-gradient(ellipse at 90% 42%, rgba(82,80,255,.12), transparent 35%),
        #080d19;
      color: var(--glass-text);
    }

    .portfolio-page {
      width: min(1120px, 92%);
      margin-inline: auto;
    }

    .glass-panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(0,0,0,.2);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .portfolio-hero {
      position: relative;
      overflow: hidden;
      margin: 35px 0 26px;
      padding: clamp(25px,5vw,55px);
    }

    .portfolio-hero::before {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      left: -80px;
      top: -100px;
      border-radius: 50%;
      background: rgba(0,174,255,.15);
      filter: blur(35px);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(82,200,255,.3);
      border-radius: 999px;
      background: rgba(82,200,255,.08);
      color: var(--glass-blue);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .portfolio-hero h1 {
      margin: 22px 0 14px;
      font-size: clamp(29px,5vw,48px);
      line-height: 1.5;
    }

    .portfolio-hero h1 span {
      color: var(--glass-blue);
    }

    .portfolio-hero p,
    .section-heading p,
    .work > p,
    .portfolio-cta p {
      color: var(--glass-muted);
      line-height: 2.1;
    }

    .portfolio-hero p {
      max-width: 680px;
      margin: 0;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 25px;
    }

    .hero-tags span {
      padding: 8px 12px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      background: rgba(255,255,255,.035);
      color: #d6e8ff;
      font-size: 12px;
    }

    .motion-panel {
      padding: 20px;
      margin-bottom: 35px;
    }

    .motion-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .motion-heading h2 {
      font-size: 18px;
      margin: 0;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(82,200,255,.09);
      border: 1px solid rgba(82,200,255,.22);
      color: var(--glass-blue);
      font-size: 11px;
    }

    .motion-frame {
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      background: #050914;
    }

    .portfolio-motion-video {
      display: block;
      width: 100%;
      max-height: 440px;
      object-fit: contain;
      margin-inline: auto;
    }

    .motion-caption {
      margin: 13px 0 0;
      color: var(--glass-muted);
      font-size: 13px;
      line-height: 1.9;
    }

    .section-heading {
      margin: 38px 0 18px;
    }

    .section-heading h2 {
      font-size: clamp(21px,3vw,29px);
      margin: 0 0 9px;
    }

    .section-heading p {
      margin: 0;
      font-size: 14px;
    }

    .portfolio-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 22px 0;
    }

    .portfolio-filter {
      padding: 10px 15px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(255,255,255,.035);
      color: #d6e8ff;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: .2s ease;
    }

    .portfolio-filter:hover,
    .portfolio-filter.active {
      border-color: rgba(82,200,255,.6);
      background: rgba(82,200,255,.14);
      color: #fff;
      box-shadow: 0 0 20px rgba(0,157,255,.08);
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(2,minmax(0,1fr));
      gap: 18px;
    }

    .work {
      min-width: 0;
      overflow: hidden;
      padding: 16px;
      transition: transform .25s ease,border-color .25s ease;
      scroll-margin-top: 25px;
    }

    .work:hover {
      transform: translateY(-4px);
      border-color: rgba(82,200,255,.5);
    }

    .work[hidden] {
      display: none !important;
    }

    /* تصویر کارت داخل نمونه‌کار هویت بصری */
    .work-image-wrap {
      overflow: hidden;
      margin: 16px 0 12px;
      border: 1px solid rgba(125,190,255,.18);
      border-radius: 17px;
      background: rgba(5,9,20,.75);
    }

    .work-image {
      display: block;
      width: 100%;
      max-height: 420px;
      object-fit: contain;
      border-radius: 17px;
    }

    .work-art {
      min-height: 165px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 17px;
      border: 1px solid rgba(125,190,255,.18);
      border-radius: 17px;
      background:
