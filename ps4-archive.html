<meta name="description" content="آرشیو بازی‌های ALIREZA WEB">
<title>آرشیو بازی‌ها | ALIREZA WEB</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#070b18;
    color:#fff;
    min-height:100vh;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(5,10,25,.92);
    backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(0,195,255,.25);
    padding:18px 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    color:#00c8ff;
    font-size:21px;
    font-weight:bold;
    letter-spacing:1px;
    text-shadow:0 0 15px #008cff;
}

.logo span{color:white}

.header-link{
    color:#00c8ff;
    text-decoration:none;
    font-size:13px;
}

.container{
    width:90%;
    max-width:1250px;
    margin:35px auto;
}

.hero{
    text-align:center;
    padding:35px 15px;
    margin-bottom:25px;
    border:1px solid rgba(0,195,255,.2);
    border-radius:20px;
    background:linear-gradient(135deg,#101b35,#080d1c);
    box-shadow:0 0 30px rgba(0,150,255,.08);
}

.hero h1{
    font-size:30px;
    color:#00c8ff;
    text-shadow:0 0 18px rgba(0,195,255,.5);
    margin-bottom:12px;
}

.hero p{
    color:#b8c5d9;
    font-size:14px;
    line-height:2;
}

.counter{
    margin-top:18px;
    color:#00d9ff;
    font-size:14px;
}

.search-box{
    margin:25px auto;
    max-width:600px;
}

.search-box input{
    width:100%;
    padding:15px 18px;
    border-radius:12px;
    border:1px solid #174b70;
    outline:none;
    background:#0c1528;
    color:white;
    font-family:Tahoma;
    font-size:14px;
}

.search-box input:focus{
    border-color:#00c8ff;
    box-shadow:0 0 15px rgba(0,195,255,.2);
}

.filters{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:30px;
}

.filter-btn{
    padding:10px 17px;
    border-radius:30px;
    border:1px solid #164c70;
    background:#0c1528;
    color:#c8d8eb;
    cursor:pointer;
    font-family:Tahoma;
    font-size:12px;
    transition:.3s;
}

.filter-btn:hover,
.filter-btn.active{
    background:#007eae;
    color:white;
    border-color:#00c8ff;
    box-shadow:0 0 15px rgba(0,195,255,.25);
}

.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:22px;
}

.game-card{
    background:linear-gradient(145deg,#111d34,#0a1020);
    border:1px solid rgba(0,195,255,.18);
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
    min-width:0;
}

.game-card:hover{
    transform:translateY(-6px);
    border-color:#00c8ff;
    box-shadow:0 8px 25px rgba(0,150,255,.15);
}

.poster{
    width:100%;
    aspect-ratio:4/5;
    background:#080d19;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    overflow:hidden;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.no-image{
    color:#526780;
    font-size:13px;
    text-align:center;
    line-height:2;
}

.game-info{padding:14px}

.game-info h3{
    font-size:14px;
    line-height:1.8;
    min-height:48px;
    color:#fff;
    margin-bottom:10px;
}

.tags{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:7px;
}

.tag{
    font-size:10px;
    padding:6px 9px;
    border-radius:20px;
    background:rgba(0,195,255,.1);
    color:#00c8ff;
    border:1px solid rgba(0,195,255,.2);
}

.platform{
    color:#aab8cc;
    font-size:10px;
}

.empty{
    display:none;
    text-align:center;
    padding:45px 10px;
    color:#aab8cc;
}

footer{
    margin-top:60px;
    padding:25px 15px;
    text-align:center;
    background:#050914;
    border-top:1px solid rgba(0,195,255,.2);
    color:#8292a9;
    font-size:12px;
    line-height:2.2;
}

footer strong{color:#00c8ff}

@media(max-width:600px){
    header{padding:15px 5%}
    .logo{font-size:17px}
    .container{width:92%}
    .hero h1{font-size:23px}
    .games-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:13px;
    }
    .game-info{padding:10px}
    .game-info h3{font-size:12px}
}
</style>

const grid = document.getElementById("gamesGrid");
const searchInput = document.getElementById("searchInput");
const count = document.getElementById("gameCount");
const emptyMessage = document.getElementById("emptyMessage");

let selectedCategory = "all";

function renderGames(){

    const searchText = searchInput.value.trim().toLowerCase();

    const filteredGames = games.filter(game => {

        const matchesSearch =
            game.name.toLowerCase().includes(searchText) ||
            game.category.toLowerCase().includes(searchText) ||
            game.platform.toLowerCase().includes(searchText);

        const matchesCategory =
            selectedCategory === "all" ||
            game.category === selectedCategory;

        return matchesSearch && matchesCategory;
    });

    grid.innerHTML = "";

    filteredGames.forEach(game => {

        const card = document.createElement("article");
        card.className = "game-card";

        const poster = document.createElement("div");
        poster.className = "poster";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;
        img.loading = "lazy";

        img.onerror = function(){
            poster.innerHTML =
                '<div class="no-image">تصویر بازی در دسترس نیست</div>';
        };

        poster.appendChild(img);

        const info = document.createElement("div");
        info.className = "game-info";

        const title = document.createElement("h3");
        title.textContent = game.name;

        const tags = document.createElement("div");
        tags.className = "tags";

        const category = document.createElement("span");
        category.className = "tag";
        category.textContent = game.category;

        const platform = document.createElement("span");
        platform.className = "platform";
        platform.textContent = game.platform;

        tags.appendChild(category);
        tags.appendChild(platform);

        info.appendChild(title);
        info.appendChild(tags);

        card.appendChild(poster);
        card.appendChild(info);

        grid.appendChild(card);
    });

    count.textContent = filteredGames.length;

    emptyMessage.style.display =
        filteredGames.length === 0 ? "block" : "none";
}

document.querySelectorAll(".filter-btn").forEach(button => {

    button.addEventListener("click", function(){

        document.querySelectorAll(".filter-btn").forEach(btn => {
            btn.classList.remove("active");
        });

        this.classList.add("active");
        selectedCategory = this.dataset.category;

        renderGames();
    });
});

searchInput.addEventListener("input", renderGames);

renderGames();

</script>
