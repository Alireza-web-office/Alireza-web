  <title>ALIREZA WEB | خدمات وب و فناوری</title>

  <link rel="stylesheet" href="style.css">

  <style>
    /* بخش اصلی معرفی */
    .hero-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 28px 20px;
    }

    /* قاب دایره‌ای عکس */
    .profile-photo {
      display: block;
      width: 160px !important;
      height: 160px !important;
      min-width: 160px;
      min-height: 160px;
      max-width: none !important;
      max-height: none !important;
      aspect-ratio: 1 / 1;
      box-sizing: border-box;
      flex: 0 0 160px;
      border-radius: 50% !important;
      object-fit: cover;
      object-position: center center;
      border: 3px solid #35baff;
      outline: 2px solid #168bff66;
      outline-offset: 4px;
      box-shadow:
        0 0 10px #35baffaa,
        0 0 24px #168bff88,
        0 0 40px #168bff44;
      position: relative;
      z-index: 2;
      background: #080d18;
    }

    .hero-card .aw,
    .hero-card small {
      position: relative;
      z-index: 2;
    }

    .hero-card .aw {
      font-size: 30px;
    }

    .hero-card .scan {
      pointer-events: none;
    }
