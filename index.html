    .hero-card {
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 28px 20px;
    }

    /* قاب RGB عکس */
    .profile-frame {
      position: relative;
      width: 170px;
      height: 170px;
      flex: 0 0 170px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      isolation: isolate;
    }

    .profile-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(120deg, #00d9ff, #7b2cff, #ff00b7, #ff3030, #00ff99, #00d9ff);
      background-size: 300% 300%;
      animation: rgb-border 7s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      z-index: 2;
    }

    .profile-frame::after {
      content: "";
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(#00d9ff, #7b2cff, #ff00b7, #ff3030, #00ff99, #00d9ff);
      filter: blur(13px);
      opacity: 0.45;
      animation: rgb-border 7s linear infinite;
      z-index: -1;
    }

    @keyframes rgb-border {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .profile-photo {
      display: block !important;
      width: 160px !important;
      height: 160px !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 160px !important;
      max-height: 160px !important;
      flex: 0 0 160px !important;
      border-radius: 50% !important;
      object-fit: contain !important;
      object-position: center !important;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      position: relative;
      z-index: 1;
      background: #080d18;
    }

    .hero-card .aw,
    .hero-card small { position: relative; z-index: 2; }
    .hero-card .aw { font-size: 30px; }
    .hero-card .scan { pointer-events: none; }
